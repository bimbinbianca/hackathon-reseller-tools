<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuanReply</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper"> 
        <aside>
            <ul>
                <li><a href="#folder">📁 Folder</a></li>
                <li><a href="#item">✨ My Item</a></li>
            </ul>
        </aside>

        <main>
            <nav class="top-nav">
                <div class="nav-left">
                    <span class="logo-text">CuanReply</span>
                </div>

                <div class="nav-center">
                    <div class="region-pill">
                        <span>📍Jakarta</span>
                        <div class="dropdown">
                            <button class="dropbtn"></button>
                            <div class="dropdown-content">
                                <a href="#">Jakarta</a>
                                <a href="#">Makassar</a>
                                <a href="#">Nusantara</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="nav-right">
                    <span class="model-info">Powered by Amazon Nova Lite</span>
                </div>
            </nav>

            <div class="hero-section">
                <h1>Welcome to CuanReply</h1>
                <h2>What do you want to do?</h2>
            </div>

            <div class="input-container">
                <button type="button" id="attachBtn">+</button>
                <input type="text" id="chatInput" placeholder="Just Drop it here..">
                <button type="button" id="sendBtn">Enter</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
